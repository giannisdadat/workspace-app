spring.application.name=workspace-saas


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workspace_saas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secret}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hidernate.format_sql=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-32chars-min}
app.jwt.expiration-ms=3600000